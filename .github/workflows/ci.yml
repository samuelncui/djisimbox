name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan workspace and Git history for secrets
        run: bash scripts/check-secrets.sh
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Verify source and dependencies
        run: |
          test -z "$(gofmt -l cmd internal)"
          go mod download
          go mod verify
          go vet ./...
          git diff --exit-code -- go.mod go.sum
      - name: Test with isolated D-Bus
        run: |
          command -v dbus-daemon
          go test -race -count=1 ./...

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - name: Build and inspect Linux packages
        id: package
        run: |
          version="dev-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            version="$GITHUB_REF_NAME"
          fi
          python3 scripts/build-release.py "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Upload downloadable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: djisimbox-${{ steps.package.outputs.version }}-linux
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: djisimbox-${{ needs.build.outputs.version }}-linux
          path: dist
      - name: Verify and publish existing tag
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          sha256sum --check --strict SHA256SUMS
          assets=("djisimbox_${VERSION}_linux_arm64.tar.gz" "djisimbox_${VERSION}_linux_amd64.tar.gz" SHA256SUMS)
          options=(--verify-tag --title "$VERSION" --generate-notes)
          if [[ "${VERSION%%+*}" == *-* ]]; then
            options+=(--prerelease)
          fi
          gh release create "$VERSION" "${assets[@]}" "${options[@]}"
